<!DOCTYPE html>
<html>
<body>
<div id="container">
  <span><svg id="mysvg" width="100" height="100"><circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" /></svg> Test</span>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  setTimeout(() => {
    html2canvas(document.getElementById('mysvg')).then(canvas => {
      document.body.appendChild(canvas);
      console.log("Canvas rendered");
    });
  }, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<div id="wrapper" style="width: 740px; height: 190px;">
  <svg className="w-full h-full" viewBox="0 0 740 190" preserveAspectRatio="none">
    <line x1="40" y1="20" x2="720" y2="20" stroke="#1e293b" strokeDasharray="3,3" />
    <text x="20" y="25">Test</text>
  </svg>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  setTimeout(() => {
    html2canvas(document.getElementById('wrapper')).then(canvas => {
      console.log(canvas.toDataURL());
    });
  }, 1000);
</script>
</body>
</html>
